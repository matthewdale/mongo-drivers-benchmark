# Brings up MongoDB 8 and the PHP load-test service. The service depends on
# mongo being healthy and connects via mongodb://mongo:27017.

services:
  mongo:
    image: mongo:8
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  service:
    build:
      context: .
    environment:
      MONGODB_URI: mongodb://mongo:27017
      PORT: "8080"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:8080"
